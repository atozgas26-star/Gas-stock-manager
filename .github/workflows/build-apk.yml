name: Build Gas Stock Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q GasStockManager_V1.zip
          find . -name settings.gradle.kts -print

      - name: Find project folder
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -print -quit)")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $PROJECT_DIR"

      - name: Enable AndroidX
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> "$PROJECT_DIR/gradle.properties"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find . -name "app-debug.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GasStockManager-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
